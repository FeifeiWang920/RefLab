# SPDX-License-Identifier: MIT
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: windows-latest
    env:
      # 小矩阵稠密求解：BLAS 内部多线程只有同步开销（engine 自带面片级并行）
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 全量安装（STEP + CATIA COM 依赖）
      - name: Install
        run: pip install -e ".[dev,step,catia]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
