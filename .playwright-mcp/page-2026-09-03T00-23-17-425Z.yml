        - listitem [ref=e111]:
          - strong [ref=e112]: Pass 1
          - text: ：每个面片独立、绝对地求解（锚定在载体上）；
        - listitem [ref=e113]:
          - strong [ref=e114]: Pass 2
          - text: ：对整个远场投影做一次边缘极值仿射校准（仅范围，不锁内部），补偿可积投影的整体拉伸/平移；
        - listitem [ref=e115]:
          - strong [ref=e116]: Pass 3
          - text: ：计算面片当前的
          - strong [ref=e117]: 实际反射角
          - text: ，与目标角做差后重新提问（逆问题），默认 1 轮，均匀光强 5 轮；
        - listitem [ref=e118]:
          - strong [ref=e119]: Pass 4（可选）
          - text: ：邻边基线——把相邻面片的共享边曲线取平均后作为边界条件重新求解，使整族面片在共享边处水密（C0）。注意这会轻微牺牲共享边附近的光学精度（两种设计对边缘坡度的要求相反），默认关闭。
