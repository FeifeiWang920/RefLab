    - generic [ref=e159]:
      - heading "7. 性能架构" [level=2] [ref=e160]
      - paragraph [ref=e161]: 16×16（256 面片）网格约 3 秒完成生成，关键措施：
      - list [ref=e162]:
        - listitem [ref=e163]:
          - strong [ref=e164]: 预分解最小二乘
          - text: ：高度重建的系数矩阵只依赖网格几何，与坡度无关。 每个面片只组装/分解一次，迭代中仅做矩阵-向量乘； 早期实现每轮迭代都做一遍 SVD 最小二乘，占总耗时约 77%；
        - listitem [ref=e165]:
          - strong [ref=e166]: 向量化目标网格
          - text: ：所有目标角查询闭包支持整网格数组输入， 消除每面片每轮数百次 Python 标量调用；
        - listitem [ref=e167]:
          - strong [ref=e168]: 并行层级
          - text: ：面片之间天然独立，由线程池并行（
          - code [ref=e169]: MF_REFLECTOR_JOBS
          - text: 可调）； BLAS 内部线程限制为 1——小矩阵场景下 OpenBLAS 多线程只有同步开销， 两层同时并行会互相踩踏；
        - listitem [ref=e170]:
          - strong [ref=e171]: NURBS 节点搜索
          - text: 用 numba JIT 加速（
          - code [ref=e172]: geometry/nurbs.py
          - text: ）；
        - listitem [ref=e173]:
          - strong [ref=e174]: 黄金基线守护
          - text: ：
          - code [ref=e175]: tests/test_golden_height_field.py
          - text: 对 7 组参数矩阵 断言优化前后高度场
          - code [ref=e176]: max|Δz| < 1e-8 mm
          - text: ——所有性能改动都不允许触碰光学结果。
