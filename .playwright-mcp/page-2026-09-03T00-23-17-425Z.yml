      - paragraph [ref=e57]:
        - text: 核心难点：按反射定律逐点算出的坡度场
        - strong [ref=e58]: 并不严格可积
        - text: （∂²z/∂x∂y 在 x 方向与 y 方向的求值顺序不一致），直接沿路径积分会产生路径相关的褶皱。 MF Reflector 把它转化为一个
        - strong [ref=e59]: 最小二乘梯度匹配问题
        - text: ：
      - generic [ref=e60]:
        - text: min
        - subscript [ref=e61]: z
        - text: Σ ( (z
        - subscript [ref=e62]: j,i+1
        - text: −z
        - subscript [ref=e63]: j,i
        - text: )/Δx − dzx
        - subscript [ref=e64]: j,i
        - text: )² + Σ ( (z
        - subscript [ref=e65]: j+1,i
        - text: −z
        - subscript [ref=e66]: j,i
        - text: )/Δy − dzy
        - subscript [ref=e67]: j,i
        - text: )²， z
        - subscript [ref=e68]: seed
        - text: = 定值
      - paragraph [ref=e69]: 即寻找「坡度最贴合反射定律」的光滑高度场。其中：
      - list [ref=e70]:
        - listitem [ref=e71]: 区间坡度取两端节点坡度的平均（梯形规则），避免向平均角度聚光；
        - listitem [ref=e72]:
          - text: 网格边界行/列赋予更高权重（
          - code [ref=e73]: edge_weight
          - text: ），保证远场矩形的
          - strong [ref=e74]: 轮廓
          - text: 被遵守；
        - listitem [ref=e75]: 种子点高度固定（Dirichlet 约束），整片高度以此为基准。
      - paragraph [ref=e76]: 该问题组装为稠密线性系统后一次求解。性能优化后，设计矩阵只依赖网格几何， 分解一次即可在迭代中反复使用（见第 7 节）。
      - heading "3.1 迭代外环" [level=3] [ref=e77]
      - paragraph [ref=e78]:
        - text: 坡度场本身依赖当前高度 z（改变入射角），因此外环按
        - code [ref=e79]: solver_iterations
        - text: （默认 5 次）迭代「算坡度 → 重建高度」， 直到高度增量 ≤
        - code [ref=e80]: solver_tolerance
        - text: （默认 1e-5 mm）。
      - heading "3.2 均匀光强模式" [level=3] [ref=e81]
      - paragraph [ref=e82]:
        - text: 默认模式下角度随面片参数
        - strong [ref=e83]: 线性
        - text: 分布。开启
        - code [ref=e84]: uniform_intensity
        - text: 后， 程序按入射通量（距离平方衰减 × 发光分布 × 入射角余弦）做
        - strong [ref=e85]: 可分离的累积分布映射
        - text: ： 通量大的区域角度被压缩、通量小的区域被拉伸，使远场矩形内光强均匀。 该模式额外运行 5 轮空间逆问题迭代与极值抛光，计算时间约为默认模式的数倍。
